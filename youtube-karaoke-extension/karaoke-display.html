<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎤 Karaoke Display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #videoContainer {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    #loadingMessage {
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 2em;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="videoContainer">
    <div id="loadingMessage">
      <p>🎤</p>
      <p>In attesa del video...</p>
      <p style="font-size: 0.5em; margin-top: 20px;">Controlla il player sul monitor principale</p>
    </div>
  </div>

  <script src="karaoke-display.js"></script>
</body>
</html>
